name: Docker Hub Frontend

on:
  push:
    branches:
      - develop
  schedule:
    - cron: "0 13 * * *" # 8:00 AM Perú (UTC-5)
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build and Push Frontend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./AS232S5_AEJ_10-fe
          file: ./AS232S5_AEJ_10-fe/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mis-apis-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mis-apis-frontend:${{ github.sha }}
